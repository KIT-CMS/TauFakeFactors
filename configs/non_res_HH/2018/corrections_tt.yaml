          ">=3": 0.25
        var_bins:
          "==2": [0.0, 0.2, 0.79, 1.02, 2.0]
          ">=3": [0.0, 0.2, 0.7, 0.91, 1.16, 2.0]

  ttbar_subleading:
    non_closure:
      tau_decaymode_2:
        <<: [*tau_decaymode_2, *ttbar_jsplit]
      pt_1:
        <<: [*pt_1, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*pt_1__eq_bin_opt, *ttbar_subleading_var_dependence_n_bins]
        bandwidth:
