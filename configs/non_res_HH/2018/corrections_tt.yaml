templates:
  split_schemes:
    2j:
      split_categories:
        n_jets: ["==0", ">=1"]
      split_categories_binedges:
        n_jets: [-0.5, 0.5, 22.5]
      correction_option:
        "==0": "smoothed"
        ">=1": "smoothed"
      bandwidth:
        "==0": 1.0
        ">=1": 1.0
    1j:
      split_categories:
        n_jets: [">=0"]
      split_categories_binedges:
        n_jets: [-0.5, 22.5]
      correction_option:
        ">=0": "smoothed"
      bandwidth:
        ">=0": 1.0
    QCD_jsplit: &QCD_jsplit
      split_categories:
        n_jets: [">=2"]
      split_categories_binedges:
        n_jets: [1.5, 22.5]
    ttbar_jsplit: &ttbar_jsplit
      split_categories:
        n_jets: ["==2", ">=3"]
      split_categories_binedges:
        n_jets: [1.5, 2.5, 22.5]
  var_dependence_n_bins:
    QCD:
      equipopulated_binning_options: &QCD_var_dependence_n_bins
        var_dependence_n_bins:
          ">=2": 7
    QCD_subleading:
      equipopulated_binning_options: &QCD_subleading_var_dependence_n_bins
        var_dependence_n_bins:
          ">=2": 6
    ttbar:
      equipopulated_binning_options: &ttbar_var_dependence_n_bins
        var_dependence_n_bins:
          "==2": 3
          ">=3": 4
    ttbar_subleading:
      equipopulated_binning_options: &ttbar_subleading_var_dependence_n_bins
        var_dependence_n_bins:
          "==2": 3
          ">=3": 4
  variables:
    mass_1: &mass_1
      var_dependence: mass_1
      equipopulated_binning_options: &mass_1__eq_bin_opt
        variable_config:
          mass_1:
            min: 0.2
            max: 2.0
            rounding: 2
        add_left: [0.0]
      correction_option: "binwise#[0]+smoothed"
    mass_2: &mass_2
      var_dependence: mass_2
      equipopulated_binning_options: &mass_2__eq_bin_opt
        variable_config:
          mass_2:
            min: 0.2
            max: 2.0
            rounding: 2
        add_left: [0.0]
      correction_option: "binwise#[0]+smoothed"
    pt_tautau: &pt_tautau
      var_dependence: pt_tautau
      equipopulated_binning_options: &pt_tautau__eq_bin_opt
        variable_config:
          pt_tautau:
            min: 0.0
            max: 150.0
            rounding: 2
      correction_option: "smoothed"
      bandwidth: 30
    pt_1: &pt_1
      var_dependence: pt_1
      equipopulated_binning_options: &pt_1__eq_bin_opt
        variable_config:
          pt_1:
            min: 32.0
            max: 150.0
            rounding: 2
      correction_option: "smoothed"
      bandwidth: 20.0
    pt_2: &pt_2
      var_dependence: pt_2
      equipopulated_binning_options: &pt_2__eq_bin_opt
        variable_config:
          pt_2:
            min: 20.0
            max: 150.0
            rounding: 2
      correction_option: "binwise#[0]+smoothed"
      bandwidth: 15.0
    tau_decaymode_1: &tau_decaymode_1
      var_dependence: tau_decaymode_1
      correction_option: "binwise"
      bandwidth: 1.0
      var_bins: [-0.5, 0.5, 9.5, 10.5, 11.5]
    tau_decaymode_2: &tau_decaymode_2
      var_dependence: tau_decaymode_2
      correction_option: "binwise"
      bandwidth: 1.0
      var_bins: [-0.5, 0.5, 9.5, 10.5, 11.5]
    m_vis:
      var_dependence: m_vis
      equipopulated_binning_options:
        variable_config:
          m_vis:
            min: 10.0
            max: 250.0
            rounding: 2
      correction_option: "smoothed"
      bandwidth: 30
    met: &met
      var_dependence: met
      equipopulated_binning_options: &met__eq_bin_opt
        variable_config:
          met:
            min: 0.0
            max: 175.0
            rounding: 2
      correction_option: "smoothed"
      bandwidth: 20
    mt_tot: &mt_tot
      var_dependence: mt_tot
      equipopulated_binning_options: &mt_tot__eq_bin_opt
        variable_config:
          mt_tot:
            min: 0.0
            max: 250.0
            rounding: 2
      correction_option: "smoothed"
      bandwidth: 30
    pt_vis: &pt_vis
      var_dependence: pt_vis
      equipopulated_binning_options: &pt_vis__eq_bin_opt
        variable_config:
          pt_vis:
            min: 0.0
            max: 250.0
            rounding: 2
      correction_option: "smoothed"
      bandwidth: 25
    eta_1:
      var_dependence: eta_1
      equipopulated_binning_options:
        variable_config:
          eta_1:
            min: -2.5
            max: 2.5
            rounding: 2
      correction_option: "smoothed"
      bandwidth: 1.0
    eta_2:
      var_dependence: eta_2
      equipopulated_binning_options:
        variable_config:
          eta_2:
            min: -2.5
            max: 2.5
            rounding: 2
      correction_option: "smoothed"
      bandwidth: 1.0

channel: tt
target_processes:
  QCD:
    chain_DR_SR_to_non_closure: true
    non_closure:
      tau_decaymode_1:
        <<: [*tau_decaymode_1, *QCD_jsplit]
      pt_2:
        <<: [*pt_2, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*pt_2__eq_bin_opt, *QCD_var_dependence_n_bins]
        bandwidth: 13.0
        var_bins:
          ">=2": [20.0, 41.64, 43.4, 45.48, 48.39, 52.58, 60.91, 150.0]
      met:
        <<: [*met, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*met__eq_bin_opt, *QCD_var_dependence_n_bins]
        correction_option: "binwise#[2]+smoothed"
        bandwidth: 20
        var_bins:
          ">=2": [0.0, 13.31, 19.52, 26.17, 33.1, 41.72, 55.62, 175.0]
      mt_tot:
        <<: [*mt_tot, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*mt_tot__eq_bin_opt, *QCD_var_dependence_n_bins]
          var_dependence_n_bins:
            ">=2": 6
        bandwidth:
          ">=2": 10.0
        var_bins:
          ">=2": [0.0, 91.22, 111.65, 127.56, 143.86, 168.31, 250.0]
      pt_vis:
        <<: [*pt_vis, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*pt_vis__eq_bin_opt, *QCD_var_dependence_n_bins]
        var_bins:
          ">=2": [0.0, 23.09, 38.86, 56.47, 72.87, 89.55, 111.13, 250.0]
      mass_1:
        <<: [*mass_1, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*mass_1__eq_bin_opt, *QCD_var_dependence_n_bins]
          var_dependence_n_bins:
            ">=2": 5
        bandwidth: 0.3
        var_bins:
          ">=2": [0.0, 0.2, 0.66, 0.87, 1.06, 1.26, 2.0]
      mass_2:
        <<: [*mass_2, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*mass_2__eq_bin_opt, *QCD_var_dependence_n_bins]
          var_dependence_n_bins:
            ">=2": 5
        bandwidth: 0.4
        var_bins:
          ">=2": [0.0, 0.2, 0.61, 0.81, 0.99, 1.2, 2.0]

    DR_SR:
      use_embedding: false
      use_orthogonal_fake_factors: true
      compute_orthogonal_fake_factors_using_data: true
      <<: [*pt_tautau, *QCD_jsplit]
      equipopulated_binning_options:
        <<: [*pt_tautau__eq_bin_opt, *QCD_var_dependence_n_bins]
        var_dependence_n_bins:
          ">=2": 25
      bandwidth: 25
      var_bins:
        ">=2": [0.0, 13.37, 19.57, 24.22, 28.83, 32.87, 36.89, 40.58, 44.29, 48.1, 51.79, 55.48, 59.18, 63.17, 67.0, 71.11, 75.39, 80.05, 84.94, 90.05, 95.44, 101.85, 109.8, 118.98, 130.9, 150.0]

      SRlike_cuts:
        had_tau_id_vs_jet_2: (id_tau_vsJet_VVVLoose_2 > 0.5) && (id_tau_vsJet_Medium_2 < 0.5)
      ARlike_cuts:
        had_tau_id_vs_jet_2: (id_tau_vsJet_VVVLoose_2 > 0.5) && (id_tau_vsJet_Medium_2 < 0.5)
      AR_SR_cuts:
        tau_pair_sign: (q_1*q_2) < 0

      non_closure:
        tau_decaymode_1:
          <<: [*tau_decaymode_1, *QCD_jsplit]

  QCD_subleading:
    chain_DR_SR_to_non_closure: true
    non_closure:
      tau_decaymode_2:
        <<: [*tau_decaymode_2, *QCD_jsplit]
      pt_1:
        <<: [*pt_1, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*pt_1__eq_bin_opt, *QCD_subleading_var_dependence_n_bins]
        bandwidth: 20.0
        var_bins:
          ">=2": [32.0, 49.79, 56.35, 64.33, 75.14, 92.15, 150.0]
      met:
        <<: [*met, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*met__eq_bin_opt, *QCD_subleading_var_dependence_n_bins]
        correction_option: "binwise#[2]+smoothed"
        bandwidth: 20
        var_bins:
          ">=2": [0.0, 14.4, 21.67, 29.47, 38.81, 53.07, 175.0]
      mt_tot:
        <<: [*mt_tot, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*mt_tot__eq_bin_opt, *QCD_subleading_var_dependence_n_bins]
        bandwidth:
          ">=2": 30.0
        var_bins:
          ">=2": [0.0, 91.22, 111.65, 127.56, 143.86, 168.31, 250.0]
      pt_vis:
        <<: [*pt_vis, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*pt_vis__eq_bin_opt, *QCD_subleading_var_dependence_n_bins]
        var_bins:
          ">=2": [0.0, 25.82, 44.88, 64.58, 84.37, 106.16, 250.0]
      mass_2:
        <<: [*mass_2, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*mass_2__eq_bin_opt, *QCD_subleading_var_dependence_n_bins]
          var_dependence_n_bins:
            ">=2": 5
        bandwidth: 0.4
        var_bins:
          ">=2": [0.0, 0.2, 0.61, 0.81, 0.99, 1.2, 2.0]
      mass_1:
        <<: [*mass_1, *QCD_jsplit]
        equipopulated_binning_options:
          <<: [*mass_1__eq_bin_opt, *QCD_subleading_var_dependence_n_bins]
          var_dependence_n_bins:
            ">=2": 5
        bandwidth: 0.3
        var_bins:
          ">=2": [0.0, 0.2, 0.66, 0.87, 1.06, 1.26, 2.0]

    DR_SR:
      use_embedding: false
      use_orthogonal_fake_factors: true
      compute_orthogonal_fake_factors_using_data: true
      <<: [*pt_tautau, *QCD_jsplit]
      equipopulated_binning_options:
        <<: [*pt_tautau__eq_bin_opt, *QCD_subleading_var_dependence_n_bins]
        var_dependence_n_bins:
          ">=2": 20
      bandwidth: 20
      var_bins:
        ">=2": [0.0, 15.37, 22.33, 27.87, 33.09, 37.7, 42.32, 47.01, 51.68, 56.43, 61.12, 66.05, 70.92, 76.35, 82.3, 88.45, 95.62, 103.69, 113.55, 127.29, 150.0]

      SRlike_cuts:
        had_tau_id_vs_jet_1: (id_tau_vsJet_VVVLoose_1 > 0.5) && (id_tau_vsJet_Medium_1 < 0.5)
      ARlike_cuts:
        had_tau_id_vs_jet_1: (id_tau_vsJet_VVVLoose_1 > 0.5) && (id_tau_vsJet_Medium_1 < 0.5)
      AR_SR_cuts:
        tau_pair_sign: (q_1*q_2) < 0

      non_closure:
        # mass_2:
        #   <<: [*mass_2, *2j_split]
        #   equipopulated_binning_options:
        #     <<: [*mass_2__eq_bin_opt, *QCD_subleading_var_dependence_n_bins]
        #   bandwidth: [0.2]
        #   var_bins:
        #     "==0": [0.1, 0.14, 0.14, 0.14, 0.45, 0.54, 0.61, 0.68, 0.75, 0.81, 0.88, 0.96, 1.04, 1.15, 1.29, 2.0]
        #     ">=1": [0.1, 0.14, 0.14, 0.49, 0.61, 0.72, 0.82, 0.93, 1.06, 1.23, 2.0]
        tau_decaymode_2:
          <<: [*tau_decaymode_2, *QCD_jsplit]

  ttbar:
    non_closure:
      tau_decaymode_1:
        <<: [*tau_decaymode_1, *ttbar_jsplit]
      pt_2:
        <<: [*pt_2, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*pt_2__eq_bin_opt, *ttbar_var_dependence_n_bins]
        bandwidth:
          "==2": 20.0
          ">=3": 20.0
        var_bins:
          "==2": [20.0, 46.31, 53.25, 150.0]
          ">=3": [20.0, 44.39, 51.81, 62.72, 150.0]
      met:
        <<: [*met, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*met__eq_bin_opt, *ttbar_var_dependence_n_bins]
        bandwidth: [20.0, 20.0]
        var_bins:
          "==2": [0.0, 46.03, 88.9, 175.0]
          ">=3": [0.0, 42.46, 65.81, 96.41, 175.0]
      mt_tot:
        <<: [*mt_tot, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*mt_tot__eq_bin_opt, *ttbar_var_dependence_n_bins]
        bandwidth:
          "==2": 20.0
          ">=3": 25.0
        var_bins:
          "==2": [0.0, 137.21, 175.25, 250.0]
          ">=3": [0.0, 127.39, 155.56, 193.15, 250.0]
      pt_vis:
        <<: [*pt_vis, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*pt_vis__eq_bin_opt, *ttbar_var_dependence_n_bins]
        var_bins:
          "==2": [0.0, 55.36, 94.09, 250.0]
          ">=3": [0.0, 49.37, 77.78, 106.79, 250.0]
      mass_1:
        <<: [*mass_1, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*mass_1__eq_bin_opt, *ttbar_var_dependence_n_bins]
        bandwidth: 0.4
        var_bins:
          "==2": [0.0, 0.2, 0.8, 1.08, 2.0]
          ">=3": [0.0, 0.2, 0.69, 0.97, 1.22, 2.0]
      mass_2:
        <<: [*mass_2, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*mass_2__eq_bin_opt, *ttbar_var_dependence_n_bins]
        bandwidth:
