          ">=3": [32.0, 57.79, 74.14, 93.84, 150.0]
      met:
        <<: [*met, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*met__eq_bin_opt, *ttbar_subleading_var_dependence_n_bins]
        bandwidth:
          "==2": 15.0
          ">=3": 15.0
        var_bins:
          "==2": [0.0, 46.03, 88.9, 175.0]
          ">=3": [0.0, 42.46, 65.81, 96.41, 175.0]
      mt_tot:
        <<: [*mt_tot, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*mt_tot__eq_bin_opt, *ttbar_subleading_var_dependence_n_bins]
        bandwidth:
          "==2": 20.0
          ">=3": 25.0
        var_bins:
          "==2": [0.0, 137.21, 175.25, 250.0]
          ">=3": [0.0, 127.39, 155.56, 193.15, 250.0]
      pt_vis:
        <<: [*pt_vis, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*pt_vis__eq_bin_opt, *ttbar_subleading_var_dependence_n_bins]
        bandwidth:
          "==2": 25.0
          ">=3": 15.0
        var_bins:
          "==2": [0.0, 55.36, 94.09, 250.0]
          ">=3": [0.0, 49.37, 77.78, 106.79, 250.0]
      mass_2:
        <<: [*mass_2, *ttbar_jsplit]
        equipopulated_binning_options:
          <<: [*mass_2__eq_bin_opt, *ttbar_subleading_var_dependence_n_bins]
        bandwidth:
          "==2": 0.27
          ">=3": 0.25
        var_bins:
          "==2": [0.0, 0.2, 0.79, 1.02, 2.0]
          ">=3": [0.0, 0.2, 0.7, 0.91, 1.16, 2.0]
      mass_1:
        <<: [*mass_1, *ttbar_jsplit]
        equipopulated_binning_options:
