# Shared preselection base, 2017 UL (NanoAOD v15, UParT) b-tag efficiency, v7: the 14 MC sample
# types of the era's SM list (CROWN sample_list/sm_2017_binned_mc.txt, production smrun2_btag_eff_v1)
# and the output columns of all six channels. The preselection_<channel>.yaml files inherit it and add
# event_selection and mc_weights; paths live in common_settings.yaml.
# No Z_pt reweighting (Run-3-only producer) and no b-tag weight (this IS the b-tag efficiency
# measurement). MC only. btag_efficiency.py counts the probe jets unweighted, so the event weights
# below only fill the 'weight' column.
# The nicks are exactly those of the list except the madgraph node_SM HH cross-check (hh2b2tau is the
# powheg kl=1 signal); the list has no ZH/ggZH HToBB ZToBB (double counted with ZToQQ, not produced).
# tests/test_btag_efficiency_run2_configs.py compares them with the CROWN list.
processes:
  hh2b2tau:
    samples:
      - GluGluToHHTo2B2T_kl-1p00_kt-1p00_c2-0p00_TuneCP5_13TeV-powheg-pythia8_RunIISummer20UL17NanoAODv15-PowhegBugFix_150X_mc2017_realistic_v1-v1
    tau_gen_modes:
      - all
  dyjets:
    samples:
      - DYJetsToLL_LHEFilterPtZ-0To50_MatchEWPDG20_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1
      - DYJetsToLL_LHEFilterPtZ-100To250_MatchEWPDG20_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1
      - DYJetsToLL_LHEFilterPtZ-250To400_MatchEWPDG20_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1
      - DYJetsToLL_LHEFilterPtZ-400To650_MatchEWPDG20_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1
      - DYJetsToLL_LHEFilterPtZ-50To100_MatchEWPDG20_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1
      - DYJetsToLL_LHEFilterPtZ-650ToInf_MatchEWPDG20_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1
      - DYJetsToLL_M-10to50_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1
      - DYJetsToLL_M-50_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1
    # The LHEFilterPtZ bins lack every zero-parton event (~69% of the M-50
    # cross section); the inclusive M-50 sample adds them. The bins cover
    # npartons >= 1, so this is a hard cut, no stitching weights; the generator
    # weight keeps the xsec and nevents of the full inclusive sample.
    sample_cuts:
      DYJetsToLL_M-50_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1: "npartons == 0"
    tau_gen_modes:
      - all
  wjets:
    samples:
      - WJetsToLNu_0J_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1
      - WJetsToLNu_1J_TuneCP5_13TeV-amcatnloFXFX-pythia8_RunIISummer20UL17NanoAODv15-150X_mc2017_realistic_v1-v1
