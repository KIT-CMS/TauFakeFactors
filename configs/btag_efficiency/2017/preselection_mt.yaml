# 2017 UL preselection, mu-tau_h channel: IsoMu27 (pT > 29), |eta_mu| < 2.1, Medium vsJet tau, mT(mu) < 50 GeV.
# Inherits preselection.yaml (processes, output columns) and common_settings.yaml (paths).
# Trigger, offline thresholds and lepton |eta| per era after v7 spec 6.2 (E2-E7, E31); 2018 also
# the HEM 15/16 veto (E29, CROWN column hem_veto). The probe jets are counted unweighted, so the
# mc_weights only fill the 'weight' column.
base_config_file: preselection.yaml
channel: mt
event_selection:
  had_tau_decay_mode: (tau_decaymode_2 == 0) || (tau_decaymode_2 == 1) || (tau_decaymode_2 == 10) || (tau_decaymode_2 == 11)
  had_tau_id_vs_ele: id_tau_vsEle_VVLoose_2 > 0.5
  had_tau_id_vs_mu: id_tau_vsMu_Tight_2 > 0.5
  had_tau_pt: pt_2 > 20
  lep_pt: ((pt_1 > 29) && (trg_single_mu27 > 0.5))
  lep_eta: (abs(eta_1) < 2.1)
  had_tau_id_vs_jet: (id_tau_vsJet_Medium_2 > 0.5)
  lep_mt: (mt_1 < 50)
  tau_pair_sign: ((q_1*q_2) < 0)
  lep_iso: ((iso_1 >= 0.0) && (iso_1 <= 0.15))
  no_extra_lep: (extramuon_veto < 0.5) && (extraelec_veto < 0.5) && (dilepton_veto < 0.5)

mc_weights:
  Top_pt_reweighting: topPtReweightWeight
  generator: ""
  had_tau_id_vs_ele: (gen_match_2==5) * ((id_tau_vsEle_VVLoose_2>0.5)*id_wgt_tau_vsEle_VVLoose_2 + (id_tau_vsEle_VVLoose_2<0.5)) + (gen_match_2!=5)
  had_tau_id_vs_mu: (gen_match_2==5) * ((id_tau_vsMu_Tight_2>0.5)*id_wgt_tau_vsMu_Tight_2 + (id_tau_vsMu_Tight_2<0.5)) + (gen_match_2!=5)
  lep_id: id_wgt_mu_1
  lep_iso: iso_wgt_mu_1
  lumi: ""
  pileup: puweight
  single_trigger: trg_wgt_single_mu27
