# Shared preselection base, 2018 UL (NanoAOD v15, UParT) b-tag efficiency:
# the 13 MC sample types and the output columns of all six channels. The
# preselection_<channel>.yaml files inherit it and add event_selection and
# mc_weights; paths live in common_settings.yaml.
# No Z_pt reweighting (Run-3-only producer, no such column in 2018 v15) and
# no b-tag weight (this IS the b-tag efficiency measurement). MC only.
