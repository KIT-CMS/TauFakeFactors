# Common settings, 2018 UL (NanoAOD v15, UParT) b-tag efficiency. Loaded
# automatically for every config in this directory; single source for the
# CROWN production and the outputs of all six channels.
#   ntuple_path  -- CROWNRun dir of production sm2018_binned_btag_eff_v2
#                   (must be an xrootd URL, see helper/functions.py:check_inputfiles)
#   output_path  -- preselection.py writes {output_path}/preselection/2018/{channel}/
#   file_path    -- btag_efficiency.py reads the same layout; must equal output_path
#   workdir_name -- payloads go to workdir/{workdir_name}/2018/{channel}/
ntuple_path: "root://cmsdcache-kit-disk.gridka.de//store/user/sdaigler/CROWN/ntuples/sm2018_binned_btag_eff_v2/CROWNRun"
output_path: "/ceph/sdaigler/CMS_FF/btag_eff_v2"
file_path:   "/ceph/sdaigler/CMS_FF/btag_eff_v2"

workdir_name: "btag_eff_v2"

era: "2018"
tree: "ntuple"
nanoAOD_version: "nanoAOD_v15"

# vsJet working points snapshotted through preselection (tau channels only).
tau_vs_jet_wps:
  - "VVVLoose"
  - "Medium"
tau_vs_jet_wgt_wps:
  - "Medium"

use_embedding: false
use_center_of_mass_bins: true

# Centre-of-mass energy [TeV] for the plot labels. Run 2 (2018) is 13 TeV,
# Run 3 is 13.6 TeV. btag_efficiency.py reads this instead of hardcoding it;
# when the key is absent it defaults to 13.6, so Run-3 output is unchanged.
center_of_mass: 13.0
