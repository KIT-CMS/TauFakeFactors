# ---------------------------------------------------------------------------
# Common settings for the 2018 UL (NanoAOD v15, UParT) b-tag efficiency
# measurement. Loaded automatically by helper.functions.load_config for every
# preselection_<channel>.yaml / btag_efficiency*.yaml in this directory.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# TODO(2018-production): no 2018 UL v15 probe-jet production exists yet, so
# these three paths are placeholders and every step will fail loudly until they
# are filled in. Replace them with the real locations, in the same style as the
# Run-3 eras (see e.g. ../2022postEE/common_settings.yaml):
#
#   ntuple_path -- the CROWNRun directory reported by
#     law run ProduceNtuples --analysis bbtautau \
#         --config sm_btag_efficiency_config --era 2018 \
#         --nanoAOD-version v15 --scopes et,mt,tt --shifts None
#     NOTE: it must be an xrootd URL. helper/functions.py:530-535 always goes
#     through the KIT dCache redirector; a plain local or /ceph path exits 1.
#   output_path -- where preselection.py writes its selected trees, as
#     {output_path}/preselection/2018/{channel}/
#   file_path   -- where btag_efficiency.py looks for them; it appends
#     preselection/{era}/{channel}/ itself, so this MUST equal output_path.
# ---------------------------------------------------------------------------
ntuple_path: "TODO_SET_AFTER_2018_PRODUCTION"
output_path: "TODO_SET_AFTER_2018_PRODUCTION"
file_path: "TODO_SET_AFTER_2018_PRODUCTION"

workdir_name: "btag_eff"

era: "2018"
tree: "ntuple"
nanoAOD_version: "nanoAOD_v15"

# Hadronic-tau-vs-jet working points snapshotted through preselection so the
# downstream steps can re-derive the vsJet weights.
tau_vs_jet_wps:
  - "VVVLoose"
  - "Medium"
tau_vs_jet_wgt_wps:
  - "Medium"

use_embedding: false
use_center_of_mass_bins: true

# Centre-of-mass energy [TeV] for the plot labels. Run 2 (2018) is 13 TeV,
# Run 3 is 13.6 TeV. btag_efficiency.py reads this instead of hardcoding it;
# when the key is absent it defaults to 13.6, so Run-3 output is unchanged.
center_of_mass: 13
