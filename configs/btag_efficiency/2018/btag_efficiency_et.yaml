# ---------------------------------------------------------------------------
# Single-channel (et) b-tag efficiency calculator config for 2018 UL
# (NanoAOD v15, UParT). Settings in common_settings.yaml are loaded first.
# Self-contained (load_config only auto-merges common_settings.yaml, not the
# shared btag_efficiency.yaml), so the probe-jet contract, pinned WPs, binning
# and the 13 sample-type categories are repeated verbatim below.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Probe-jet column contract. The probe-jet vectors are produced fully selected
# (pt / eta / ID / overlap) directly by the CROWN sm_btag_efficiency_config and
# passed through preselection.py unchanged, so the calculator reads them as-is.
# ---------------------------------------------------------------------------
jet_pt_column: "btag_probe_jet_pt"
jet_eta_column: "btag_probe_jet_eta"
jet_flavor_column: "btag_probe_jet_hadron_flavour"
jet_btag_column: "btag_probe_jet_upart"

# Per-event weight column snapshotted by preselection.py (gen sign x
# normalization x pileup / trigger / tau-ID SF products, no b-tag term).
weight_column: "weight"

# The probe jets are already fully selected in CROWN (pt >= 20, |eta| < 2.4,
# jet ID, lepton overlap removal), so no additional per-jet selection is
# applied here (empty string = pass-through).
jet_selection: ""

# ---------------------------------------------------------------------------
# B-tagging working points: UParTAK4 discriminator cut values (2018 UL v15).
# These are validated against UParTAK4_wp_values read from the pinned BTV
# payload named by btag_working_points_source (common_settings.yaml): both must
# be present and agree, else btag_efficiency.py aborts fatally.
# https://btv-wiki.docs.cern.ch/ (Run2-2018-UL-NanoAODv15)
# ---------------------------------------------------------------------------
btag_working_points:
  L: 0.0308
  M: 0.161
  T: 0.5405
  XT: 0.6992
  XXT: 0.9655

# ---------------------------------------------------------------------------
# Jet flavour categories (btag_probe_jet_hadron_flavour values)
#   b     -> bottom jets (hadronFlavour == 5)
#   c     -> charm jets  (hadronFlavour == 4)
#   light -> light/udsg jets (hadronFlavour == 0)
# ---------------------------------------------------------------------------
jet_flavor_categories:
  b: 5
  c: 4
  light: 0

# ---------------------------------------------------------------------------
# General binning for the efficiency measurement.
# ---------------------------------------------------------------------------
# Jet pT bins [GeV]
jet_pt_bins: [20, 30, 50, 70, 100, 140, 200, 300, 1000]
# Jet |eta| bins
jet_eta_bins: [0.0, 1.4, 2.4]

# ---------------------------------------------------------------------------
# Single fake-factor analysis channel for this config.
# ---------------------------------------------------------------------------
channel: et

# ---------------------------------------------------------------------------
# The 13 SM sample-type categories the efficiency payload must carry on its
# correctionlib sample_type axis (fixed by the physics program; matches
# btag_payloads.SM_BTAG_EFFICIENCY_CATEGORIES in the bbtautau CROWN config).
# Each key is used both for file discovery
#   {file_path}/preselection/{era}/{channel}/{process}*.root
# and as the sample_type key written to the correctionlib output.
# ---------------------------------------------------------------------------
processes:
  hh2b2tau:
    sample_type: "hh2b2tau"
  dyjets:
    sample_type: "dyjets"
  wjets:
    sample_type: "wjets"
  ttbar:
    sample_type: "ttbar"
  singletop:
    sample_type: "singletop"
  diboson:
    sample_type: "diboson"
  electroweak_boson:
    sample_type: "electroweak_boson"
  ggh_htautau:
    sample_type: "ggh_htautau"
  vbf_htautau:
    sample_type: "vbf_htautau"
  vbf_hbb:
    sample_type: "vbf_hbb"
  rem_hbb:
    sample_type: "rem_hbb"
  rem_higgs:
    sample_type: "rem_higgs"
  rem_ttbar:
    sample_type: "rem_ttbar"
