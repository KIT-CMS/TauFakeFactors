# ---------------------------------------------------------------------------
# Preselection config -- 2018 UL (NanoAOD v15, UParT), mu-tau_h channel.
#
# Event selection + composite per-event weight for the b-tag efficiency
# measurement. Every threshold matches what the bbtautau CROWN
# sm_btag_efficiency_config selected. The four fully-selected probe-jet vectors
# written by CROWN (btag_probe_jet_{pt,eta,hadron_flavour,upart}) are passed
# straight through to output_features together with the composite "weight".
#
# NOTE: there is NO Z_pt reweighting for 2018 (ZPtReweighting is a Run-3-only
# CROWN producer; the 2018 v15 ntuples carry no such column) and NO b-tag
# weight in the weight block (this IS the b-tag efficiency measurement).
#
# Column names are verified against the real 2018-v15 CROWN probe ntuple for
# the mt channel; et / tt use the same CROWN naming convention.
# ---------------------------------------------------------------------------
