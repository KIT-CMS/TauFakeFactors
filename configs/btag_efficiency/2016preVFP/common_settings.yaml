# Common settings, 2016preVFP UL (HIPM) (NanoAOD v15, UParT) b-tag efficiency, v7. Loaded
# automatically for every config in this directory; single source for the
# CROWN production and the outputs of all six channels.
#   ntuple_path  -- CROWNRun dir of production smrun2_btag_eff_v1 (v7 spec 8, P2:
#                   sm_btag_efficiency_config, the _mc lists of all four Run-2 eras,
#                   six scopes, --shifts None); must be an xrootd URL, see
#                   helper/functions.py:check_inputfiles
#   output_path  -- preselection.py writes {output_path}/preselection/2016preVFP/{channel}/
#   file_path    -- btag_efficiency.py reads the same layout; must equal output_path
#   workdir_name -- payloads go to workdir/{workdir_name}/2016preVFP/{channel}/
ntuple_path: "root://cmsdcache-kit-disk.gridka.de//store/user/sdaigler/CROWN/ntuples/smrun2_btag_eff_v1/CROWNRun"
output_path: "/ceph/sdaigler/CMS_FF/btag_eff_2016preVFP"
file_path:   "/ceph/sdaigler/CMS_FF/btag_eff_2016preVFP"

workdir_name: "btag_eff_2016preVFP"

era: "2016preVFP"
tree: "ntuple"
nanoAOD_version: "nanoAOD_v15"

# vsJet working points snapshotted through preselection (tau channels only).
tau_vs_jet_wps:
  - "VVVLoose"
  - "Medium"
tau_vs_jet_wgt_wps:
  - "Medium"

use_embedding: false
use_center_of_mass_bins: true

# Centre-of-mass energy [TeV] for the plot labels. Run 2 is 13 TeV, Run 3 is
# 13.6 TeV. btag_efficiency.py reads this instead of hardcoding it; when the
# key is absent it defaults to 13.6, so Run-3 output is unchanged.
center_of_mass: 13.0
