event_selection:
  had_tau_decay_mode: (tau_decaymode_2 == 0) || (tau_decaymode_2 == 1) || (tau_decaymode_2==
    10) || (tau_decaymode_2 == 11)
  had_tau_id_vs_ele: id_tau_vsEle_VVLoose_2 > 0.5
  had_tau_id_vs_mu: id_tau_vsMu_Tight_VVLoose_2 > 0.5
  had_tau_pt: pt_2 > 20
  lep_pt: (pt_1 > 26 && trg_single_mu24 > 0.5)
  jet_veto: (jet_vetomap < 0.5)
mc_weights:
  Top_pt_reweighting: topPtReweightWeight
  Z_pt_reweighting: zPtReweightWeight
  generator: ''
  lumi: ''
  pileup: puweight
  had_tau_id_vs_ele: (gen_match_2==5) * ((id_tau_vsEle_VVLoose_2>0.5)*id_wgt_tau_vsEle_VVLoose_2
    + (id_tau_vsEle_VVLoose_2<0.5)) + (gen_match_2!=5)
  had_tau_id_vs_mu: (gen_match_2==5) * ((id_tau_vsMu_Tight_VVLoose_2>0.5)*id_wgt_tau_vsMu_Tight_VVLoose_2
    + (id_tau_vsMu_Tight_VVLoose_2<0.5)) + (gen_match_2!=5)
  lep_id: id_wgt_mu_1
  lep_iso: iso_wgt_mu_1
  single_trigger: trg_wgt_single_mu24
